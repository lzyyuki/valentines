<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>A Special Surprise for Chloe 💗</title>
<meta name="description" content="For Chloe only 💌">

<style>
body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(#ffe6ea, #fff);
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  font-family: Arial, sans-serif;
  flex-direction: column;
}

.flower {
  position: absolute;
  font-size: 30px;
  animation: float 10s linear infinite;
  opacity: 0.8;
}

@keyframes float {
  0% { transform: translateY(100vh) rotate(0deg); opacity:0; }
  10% { opacity:1; }
  100% { transform: translateY(-10vh) rotate(360deg); opacity:0; }
}

@keyframes fadeIn { from { opacity:0; transform:scale(0.8);} to { opacity:1; transform:scale(1);} }

h1, h2 { color:#e63946; margin-bottom:20px; text-align:center; }

button {
  padding: 10px 20px;
  font-size: 16px;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
}

#yes { background-color: #ff6699; color:white; }
#no { background-color: #cccccc; color:black; position: relative; }

.slide {
  text-align: center;
  width: 90%;
  max-width: 400px;
}

.valentine-buttons { display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin-top:20px; }

/* Bounce animation for YES button */
@keyframes bounce {
  0% { transform: scale(1); }
  50% { transform: scale(1.2); }
  100% { transform: scale(1); }
}

/* Floating hearts on 3rd slide */
.heart {
  position: absolute;
  font-size: 20px;
  animation: floatHeart 3s linear infinite;
}
@keyframes floatHeart {
  0% { transform: translateY(0) scale(0.8); opacity:1; }
  100% { transform: translateY(-200px) scale(1.2); opacity:0; }
}

.card {
  text-align: center;
  background: white;
  padding: 40px;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  animation: fadeIn 2s ease;
  position: relative;
}

.message {
  margin-top: 20px;
  padding: 15px;
  border-radius: 15px;
  background: #fff5f7;
  font-style: italic;
  color: #444;
  line-height: 1.5;
  box-shadow: inset 0 0 10px rgba(0,0,0,0.05);
}

.music {
  margin-top: 15px;
  font-weight: bold;
  font-size: 14px;
}
.music a { text-decoration:none; color:#e63946; }
.music a:hover { text-decoration:underline; }
</style>
</head>

<body>

<!-- Slide 1 -->
<div class="slide valentine-screen">
  <h1>Can i court you? 💖</h1>
  <div class="valentine-buttons">
    <button id="yes">YES</button>
    <button id="no">NO</button>
  </div>
</div>

<!-- Slide 2 -->
<div class="slide letter-screen" style="display:none;">
  <div class="card">
    <h1>🌹 For Chloe Only 🌹</h1>
    <div class="message">
      Dear Chloe,<br><br>
      
      <!-- WRITE YOUR NEW MESSAGE HERE -->
      [Delete this line and type your own letter here!]
      
    </div>

    <div class="music">
      🎧 <a href="https://youtube.com" target="_blank">
        Play our song: “Happiness” by Rex Orange County
      </a>
    </div>

    <!-- Button to go to Slide 3 -->
    <button id="next3" style="margin-top:20px; padding:10px 20px; font-size:16px; border-radius:10px; background:#ff6699; color:white; cursor:pointer;">Next Surprise 🎉</button>
  </div>
</div>

<!-- Slide 3 -->
<div class="slide slide3" style="display:none;">
  <h2>YAYAYAYAYAYAYYYY!!! LOOKING FORWARD TO OUR JOURNEY CHLOE !!! 💖💐</h2>
  <img src="https://imgur.com" alt="Yuki Bouquet" style="width:200px; max-width:80%; border-radius:15px;">
</div>

<!-- Floating flowers -->
<div class="flower" style="left:10%; animation-delay:0s;">🌸</div>
<div class="flower" style="left:30%; animation-delay:2s;">🌷</div>
<div class="flower" style="left:50%; animation-delay:4s;">🌹</div>
<div class="flower" style="left:70%; animation-delay:1s;">🌸</div>
<div class="flower" style="left:90%; animation-delay:3s;">🌷</div>

<script>
const noBtn = document.getElementById('no');
const yesBtn = document.getElementById('yes');
const valentineScreen = document.querySelector('.valentine-screen');
const letterScreen = document.querySelector('.letter-screen');
const slide3 = document.querySelector('.slide3');
const next3 = document.getElementById('next3');
let noClickCount = 0;

function moveNoButton(){
  const x = Math.random()*(window.innerWidth-noBtn.offsetWidth-20);
  const y = Math.random()*(window.innerHeight-noBtn.offsetHeight-50);
  noBtn.style.position='absolute';
  noBtn.style.left=`${x}px`;
  noBtn.style.top=`${y}px`;
}

// NO button behavior
function handleNoClick(){
  noClickCount++;
  moveNoButton();
  if(noClickCount===1){
    noBtn.textContent="PRETTY PLEASE ☹️🥺";
  }
  // Grow YES button with bounce
  yesBtn.style.animation='none'; // reset animation
  void yesBtn.offsetWidth; // trigger reflow
  yesBtn.style.animation='bounce 0.3s';
  const style = window.getComputedStyle(yesBtn);
  const currentWidth = parseFloat(style.width);
  const newWidth = currentWidth*1.2;
  yesBtn.style.width=`${newWidth}px`;
  yesBtn.style.fontSize=`${parseFloat(style.fontSize)*1.1}px`;
}

// Event listeners for NO
noBtn.addEventListener('click', handleNoClick);
noBtn.addEventListener('touchstart', e=>{ e.preventDefault(); handleNoClick(); });

// YES button shows letter
yesBtn.addEventListener('click', ()=>{
  valentineScreen.style.display='none';
  letterScreen.style.display='block';
});

// Slide 2 → Slide 3
next3.addEventListener('click', ()=>{
  letterScreen.style.display='none';
  slide3.style.display='block';

  // Optional: floating hearts on slide3
  for(let i=0;i<15;i++){
    const heart = document.createElement('div');
    heart.className='heart';
    heart.textContent='💖';
    heart.style.left=Math.random()*80+'%';
    heart.style.animationDelay=Math.random()*2+'s';
    document.body.appendChild(heart);
  }
});
</script>

</body>
</html>
